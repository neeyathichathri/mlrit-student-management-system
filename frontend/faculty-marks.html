<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Marks | MLRIT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .marks-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .marks-form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        .marks-form label {
            display: block;
            margin-top: 15px;
        }

        .marks-form input,
        .marks-form select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h2>MLRIT Faculty Portal</h2>
        <nav>
            <a href="faculty-dashboard.html">Dashboard</a>
            <a href="#" onclick="logout(); return false;">Logout</a>
        </nav>
    </header>

    <main class="marks-container">
        <h1>Manage Student Marks</h1>
        <p>Select a student, academic year, semester and subject.</p>

        <form class="marks-form" id="marksForm">
            <label for="studentSelect">Select Student</label>
            <select id="studentSelect" required>
                <option value="">Loading students...</option>
            </select>

            <label for="academicYear">Select Academic Year</label>
            <select id="academicYear" required>
                <option value="">Select year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
            </select>

            <label for="semester">Select Semester</label>
            <select id="semester" required disabled>
                <option value="">Select semester</option>
                <option value="1">1st Semester</option>
                <option value="2">2nd Semester</option>
            </select>

            <label for="subject">Select Subject</label>
            <select id="subject" required disabled>
                <option value="">Select year and semester first</option>
            </select>

            <label for="marks">Marks Obtained</label>
            <input type="number" id="marks" min="0" max="100" required>

            <label for="maxMarks">Maximum Marks</label>
            <input type="number" id="maxMarks" min="1" value="100" required>

            <button type="submit">Save Marks</button>
            <p id="message" role="status"></p>
        </form>
    </main>

    <script>
        const token = sessionStorage.getItem("token");
        const studentSelect = document.getElementById("studentSelect");
        const academicYear = document.getElementById("academicYear");
        const semester = document.getElementById("semester");
        const subjectSelect = document.getElementById("subject");
        const marksInput = document.getElementById("marks");
        const maxMarksInput = document.getElementById("maxMarks");
        const message = document.getElementById("message");

        const subjects = {
            "1-1": [
                "Linear Algebra and Calculus",
                "Programming for Problem Solving",
                "Basic Electrical and Electronics Engineering",
                "Electronic Devices and Applications",
                "English for Skill Enhancement"
            ],
            "1-2": [
                "Numerical Methods and Integral Transforms",
                "Applied Physics",
                "Engineering Chemistry",
                "Elements of Computer Science and Engineering",
                "Engineering Drawing"
            ],
            "2-1": [
                "Computer Oriented Statistical Methods",
                "Digital Electronics and Computer Organization",
                "Data Structures",
                "Object Oriented Programming Using Java",
                "Software Engineering"
            ],
            "2-2": [
                "Discrete Mathematics",
                "Business Economics and Financial Analysis",
                "Database Management Systems",
                "Operating Systems",
                "Software Testing Fundamentals"
            ],
            "3-1": [
                "Design and Analysis of Algorithms",
                "Cloud and DevOps",
                "Computer Networks",
                "Natural Language Processing",
                "Information Retrieval System"
            ],
            "3-2": []
        };

        if (!token) {
            window.location.href = "login.html?role=Faculty";
        }

        async function loadStudents() {
            try {
                const response = await fetch(
                    "http://localhost:3000/api/faculty/students",
                    {
                        headers: {
                            Authorization: "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Unable to load students.");
                }

                studentSelect.replaceChildren();

                const defaultOption = document.createElement("option");
                defaultOption.value = "";
                defaultOption.textContent = "Select a student";
                studentSelect.appendChild(defaultOption);

                data.forEach(student => {
                    const option = document.createElement("option");
                    option.value = student.student_id;
                    option.textContent =
                        student.student_id + " - " + student.full_name;

                    option.dataset.year = student.year_of_study;
                    studentSelect.appendChild(option);
                });

                if (data.length === 0) {
                    message.textContent = "No students found.";
                }
            } catch (error) {
                message.textContent = error.message;
            }
        }

        function updateSubjects() {
            const year = academicYear.value;
            const sem = semester.value;
            const key = year + "-" + sem;
            const selectedSubjects = subjects[key] || [];

            subjectSelect.replaceChildren();

            const defaultOption = document.createElement("option");
            defaultOption.value = "";

            if (!year || !sem) {
                defaultOption.textContent =
                    "Select year and semester first";
            } else if (selectedSubjects.length === 0) {
                defaultOption.textContent =
                    "Subjects not added for this semester yet";
            } else {
                defaultOption.textContent = "Select a subject";
            }

            subjectSelect.appendChild(defaultOption);

            selectedSubjects.forEach(subject => {
                const option = document.createElement("option");
                option.value = subject;
                option.textContent = subject;
                subjectSelect.appendChild(option);
            });

            subjectSelect.disabled = selectedSubjects.length === 0;
        }

        academicYear.addEventListener("change", function() {
            semester.value = "";
            semester.disabled = !academicYear.value;
            updateSubjects();
        });

        semester.addEventListener("change", updateSubjects);

        studentSelect.addEventListener("change", function() {
            const selectedOption =
                studentSelect.options[studentSelect.selectedIndex];

            const studentYear = selectedOption.dataset.year;

            if (studentYear) {
                academicYear.value = studentYear;

                semester.disabled = false;
                semester.value = "";
                updateSubjects();
            }
        });

        document.getElementById("marksForm").addEventListener(
            "submit",
            async function(event) {
                event.preventDefault();

                const studentId = studentSelect.value;
                const year = Number(academicYear.value);
                const sem = Number(semester.value);
                const subject = subjectSelect.value;
                const marks = Number(marksInput.value);
                const maxMarks = Number(maxMarksInput.value);

                if (
                    !studentId ||
                    !year ||
                    !sem ||
                    !subject ||
                    !Number.isFinite(marks) ||
                    !Number.isFinite(maxMarks) ||
                    maxMarks <= 0 ||
                    marks < 0 ||
                    marks > maxMarks
                ) {
                    message.textContent =
                        "Please select all fields and enter valid marks.";
                    return;
                }

                message.textContent = "Saving marks...";

                try {
                    const response = await fetch(
                        "http://localhost:3000/api/faculty/marks",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: "Bearer " + token
                            },
                            body: JSON.stringify({
                                student_id: studentId,
                                academic_year: year,
                                semester: sem,
                                subject: subject,
                                marks_obtained: marks,
                                max_marks: maxMarks
                            })
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            result.message || "Unable to save marks."
                        );
                    }

                    message.textContent =
                        result.message || "Marks saved successfully!";

                    subjectSelect.value = "";
                    marksInput.value = "";
                    maxMarksInput.value = "100";
                } catch (error) {
                    message.textContent = error.message;
                }
            }
        );

        function logout() {
            sessionStorage.removeItem("token");
            sessionStorage.removeItem("user");
            window.location.href = "login.html?role=Faculty";
        }

        if (token) {
            loadStudents();
        }
    </script>
</body>
</html>
