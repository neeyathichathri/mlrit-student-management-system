
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Student Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .student-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        .student-table th,
        .student-table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .student-table th {
            background: #203b70;
            color: white;
        }

        .student-table tr:nth-child(even) {
            background: #f3f6fb;
        }

        #message {
            margin: 20px 0;
        }

        .back-button {
            margin-top: 20px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        #editStudentForm {
            display: none;
            max-width: 500px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #editStudentForm label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        #editStudentForm input,
        #editStudentForm select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #editStudentForm button {
            margin-top: 15px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .edit-button,
        .delete-button {
            padding: 7px 12px;
            margin: 3px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }

        .edit-button {
            background: #203b70;
        }

        .delete-button {
            background: #d93025;
        }

        .edit-button:hover {
            background: #162b52;
        }

        .delete-button:hover {
            background: #a82019;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h2>MLRIT Admin Portal</h2>
        <nav>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="#" onclick="logout(); return false;">Logout</a>
        </nav>
    </header>

    <div class="student-container">
        <h1>Student Management</h1>
        <p>View, update, and delete registered student records.</p>
        <button
            onclick="location.href='admin-add-student.html'"
            style="background: #198754; margin: 15px 0;">
            + Add Student
        </button>
        <p id="message">Loading students...</p>

        <div class="table-wrapper">
            <table class="student-table">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>

        <form id="editStudentForm">
            <h2>Edit Student</h2>

            <input type="hidden" id="editInternalId">

            <label for="editFullName">Full Name</label>
            <input type="text" id="editFullName" required>

            <label for="editEmail">Email</label>
            <input type="email" id="editEmail" required>

            <label for="editDepartment">Department</label>
            <input type="text" id="editDepartment" required>

            <label for="editYear">Year of Study</label>
            <select id="editYear" required>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>

            <button type="submit">Save Changes</button>
            <button type="button" onclick="cancelEdit()">Cancel</button>
        </form>

        <button class="back-button"
            onclick="location.href='admin-dashboard.html'">
            Back to Dashboard
        </button>
    </div>

    <script>
        async function loadStudents() {
            const token = sessionStorage.getItem("token");
            const message = document.getElementById("message");
            const tableBody = document.getElementById("studentTableBody");

            if (!token) {
                window.location.href = "login.html?role=Admin";
                return;
            }

            message.textContent = "Loading students...";
            tableBody.innerHTML = "";

            try {
                const response = await fetch(
                    "http://localhost:3000/api/faculty/students",
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Unable to load students."
                    );
                }

                if (!Array.isArray(data)) {
                    throw new Error("Invalid student data received.");
                }

                if (data.length === 0) {
                    message.textContent = "No student records found.";
                    return;
                }

                data.forEach(student => {
                    const row = document.createElement("tr");

                    [
                        student.student_id,
                        student.full_name,
                        student.email,
                        student.department,
                        student.year_of_study
                    ].forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "-";
                        row.appendChild(cell);
                    });

                    const actionCell = document.createElement("td");

                    const editButton = document.createElement("button");
                    editButton.type = "button";
                    editButton.textContent = "Edit";
                    editButton.className = "edit-button";

                    editButton.addEventListener("click", () => {
                        editStudent(student);
                    });

                    const deleteButton = document.createElement("button");
                    deleteButton.type = "button";
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete-button";

                    deleteButton.addEventListener("click", () => {
                        deleteStudent(student, deleteButton);
                    });

                    actionCell.appendChild(editButton);
                    actionCell.appendChild(deleteButton);
                    row.appendChild(actionCell);
                    tableBody.appendChild(row);
                });

                message.textContent =
                    "Students loaded successfully: " + data.length;

            } catch (error) {
                console.error("Load students error:", error);
                message.textContent = error.message;
            }
        }

        function editStudent(student) {
            const internalId = document.getElementById("editInternalId");

            if (
                student.id === undefined ||
                student.id === null ||
                !Number.isInteger(Number(student.id)) ||
                Number(student.id) < 1
            ) {
                document.getElementById("message").textContent =
                    "Student database ID is missing. Please check the backend student-list API.";
                return;
            }

            internalId.value = student.id;

            document.getElementById("editFullName").value =
                student.full_name || "";

            document.getElementById("editEmail").value =
                student.email || "";

            document.getElementById("editDepartment").value =
                student.department || "";

            document.getElementById("editYear").value =
                student.year_of_study ?? "";

            document.getElementById("editStudentForm").style.display =
                "block";

            document.getElementById("editStudentForm").scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        async function deleteStudent(student, button) {
            if (
                student.id === undefined ||
                student.id === null ||
                !Number.isInteger(Number(student.id)) ||
                Number(student.id) < 1
            ) {
                document.getElementById("message").textContent =
                    "Student database ID is missing. Unable to delete.";
                return;
            }

            const confirmed = confirm(
                "Are you sure you want to delete " +
                student.full_name +
                " (" + student.student_id + ")?\n\n" +
                "This will also delete the student's marks, attendance, " +
                "and login account. This action cannot be undone."
            );

            if (!confirmed) {
                return;
            }

            const token = sessionStorage.getItem("token");
            const message = document.getElementById("message");

            if (!token) {
                message.textContent = "Please log in as Admin again.";
                return;
            }

            button.disabled = true;
            message.textContent = "Deleting student...";

            try {
                const response = await fetch(
                    "http://localhost:3000/api/admin/students/" +
                    encodeURIComponent(student.id),
                    {
                        method: "DELETE",
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Unable to delete student."
                    );
                }

                const form = document.getElementById("editStudentForm");

                if (
                    document.getElementById("editInternalId").value ===
                    String(student.id)
                ) {
                    cancelEdit();
                }

                await loadStudents();

                message.textContent =
                    result.message || "Student deleted successfully!";

            } catch (error) {
                console.error("Delete student error:", error);
                message.textContent =
                    error.message ||
                    "Unable to connect to the server. Please try again.";
                button.disabled = false;
            }
        }

        function cancelEdit() {
            document.getElementById("editStudentForm").style.display =
                "none";

            document.getElementById("editStudentForm").reset();
            document.getElementById("editInternalId").value = "";
        }

        document.getElementById("editStudentForm").addEventListener(
            "submit",
            async function(event) {
                event.preventDefault();

                const token = sessionStorage.getItem("token");
                const message = document.getElementById("message");
                const id =
                    document.getElementById("editInternalId").value;

                if (!token) {
                    message.textContent =
                        "Please log in as Admin again.";
                    return;
                }

                if (
                    !id ||
                    !Number.isInteger(Number(id)) ||
                    Number(id) < 1
                ) {
                    message.textContent =
                        "Student database ID is missing. Please click Edit again.";
                    return;
                }

                const student = {
                    full_name: document.getElementById("editFullName")
                        .value.trim(),

                    email: document.getElementById("editEmail")
                        .value.trim(),

                    department: document.getElementById("editDepartment")
                        .value.trim(),

                    year_of_study: Number(
                        document.getElementById("editYear").value
                    )
                };

                if (
                    !student.full_name ||
                    !student.email ||
                    !student.department ||
                    !Number.isInteger(student.year_of_study) ||
                    student.year_of_study < 1 ||
                    student.year_of_study > 4
                ) {
                    message.textContent =
                        "Please fill in all student details correctly.";
                    return;
                }

                try {
                    message.textContent = "Updating student...";

                    const response = await fetch(
                        "http://localhost:3000/api/admin/students/" +
                        encodeURIComponent(id),
                        {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": "Bearer " + token
                            },
                            body: JSON.stringify(student)
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            result.message || "Unable to update student."
                        );
                    }

                    cancelEdit();
                    await loadStudents();

                    message.textContent =
                        result.message ||
                        "Student updated successfully!";

                } catch (error) {
                    console.error("Update student error:", error);

                    message.textContent =
                        error.message ||
                        "Unable to connect to the server. Please try again.";
                }
            }
        );

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html?role=Admin";
        }

        loadStudents();
    </script>

</body>
</html>
